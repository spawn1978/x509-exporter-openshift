# Grafana values compatibles con OpenShift (SCC restricted)
securityContext:
  runAsNonRoot: true

podSecurityContext:
  fsGroup: null

# Credenciales de admin (cambiar en produccion)
adminUser: admin
adminPassword: admin123

# Dashboard de x509-certificate-exporter importado automaticamente
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    x509-certificates:
      gnetId: 13922
      revision: 1
      datasource: Thanos
